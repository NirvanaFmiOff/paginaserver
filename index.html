<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nirvana Infinito GSM - Panel de Servicios DHRU</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase SDK JS oficial -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- FontAwesome Íconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased min-h-screen flex flex-col justify-between">

  <!-- BARRA SUPERIOR DE SOPORTE Y ESTADO -->
  <div class="bg-amber-500/10 border-b border-amber-500/20 text-xs py-2 px-4 text-amber-200">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-2">
      <div class="flex items-center space-x-3">
        <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse mr-1.5"></span> Servidor Online
        </span>
        <span class="hidden md:inline text-gray-600">|</span>
        <span class="text-amber-100/90"><i class="fa-solid fa-shield-halved text-amber-400 mr-1"></i> Compra Segura · Rápido, Fácil y Confiable</span>
      </div>
      <div class="flex items-center space-x-4 font-medium">
        <a href="https://wa.me/" target="_blank" class="hover:text-emerald-400 transition flex items-center gap-1">
          <i class="fa-brands fa-whatsapp text-emerald-400"></i> WhatsApp
        </a>
        <a href="https://t.me/" target="_blank" class="hover:text-sky-400 transition flex items-center gap-1">
          <i class="fa-brands fa-telegram text-sky-400"></i> Telegram
        </a>
      </div>
    </div>
  </div>

  <!-- NAVEGACIÓN PRINCIPAL -->
  <header class="border-b border-gray-800 bg-gray-900/90 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex justify-between items-center">
      
      <!-- LOGO -->
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-gradient-to-tr from-amber-600 to-yellow-400 rounded-xl flex items-center justify-center text-gray-950 font-black shadow-lg shadow-amber-500/20 text-xl">
          ♾️
        </div>
        <div>
          <span class="text-lg font-black tracking-wider text-white">NIRVANA <span class="text-amber-400">INFINITO</span> GSM</span>
          <span class="block text-[10px] text-gray-400 -mt-1 font-mono uppercase tracking-widest">Celulares & Tecnología</span>
        </div>
      </div>

      <!-- ÁREA DE USUARIO / LOGIN -->
      <div id="auth-header-btn">
        <button onclick="openAuthModal()" class="bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-600 hover:to-yellow-600 text-gray-950 font-black px-4 py-2 rounded-xl transition text-xs flex items-center gap-2 shadow-lg shadow-amber-500/20 uppercase tracking-wider cursor-pointer">
          <i class="fa-solid fa-user-lock"></i>
          <span>Ingresar / Registrarse</span>
        </button>
      </div>

      <div id="user-header-info" class="hidden flex items-center space-x-3">
        <div class="bg-gray-800/80 border border-amber-500/30 rounded-lg px-3 py-1.5 text-right">
          <div id="user-email-display" class="text-[10px] uppercase text-gray-400 font-semibold truncate max-w-[120px]">Usuario</div>
          <div id="display-saldo" class="text-sm font-bold text-amber-400 font-mono">$0.00 USD</div>
        </div>
        <button onclick="logout()" class="bg-gray-800 hover:bg-red-600/20 hover:text-red-400 text-gray-300 p-2.5 rounded-lg border border-gray-700 transition" title="Cerrar Sesión">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>

    </div>
  </header>

  <!-- BANNER DORADO A LA VISTA -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 w-full">
    <div class="w-full rounded-2xl overflow-hidden border border-amber-500/30 shadow-2xl shadow-amber-500/10 bg-gray-900">
      <img src="banner.png" alt="Nirvana Infinito GSM Banner" class="w-full h-auto object-cover block">
    </div>
  </div>

  <!-- CATÁLOGOS Y SERVICIOS TOTALMENTE A LA VISTA -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full flex-grow space-y-6">

    <!-- BUSCADOR -->
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="relative w-full md:w-96">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-gray-500 text-xs"></i>
        <input type="text" id="search-service" onkeyup="filterServices()" placeholder="Buscar servicio (ej: Samsung, Xiaomi, Licencias)..." class="w-full bg-gray-950 border border-gray-800 rounded-xl pl-9 pr-4 py-2.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-amber-500 transition">
      </div>
      <div class="text-xs text-amber-400 font-semibold">
        <i class="fa-solid fa-list-check mr-1"></i> Catálogo Completo de Servicios
      </div>
    </div>

    <!--
