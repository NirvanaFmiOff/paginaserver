<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nirvana Infinito GSM - Panel de Servicios DHRU</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase SDK JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .glass-panel {
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(12px);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(245, 158, 11, 0.3);
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(245, 158, 11, 0.6);
    }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-gray-950">

  <!-- MARQUEE / TOP BAR -->
  <div class="bg-gradient-to-r from-amber-500/10 via-amber-500/20 to-amber-500/10 border-b border-amber-500/30 text-xs py-2 px-4 text-amber-200">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-2">
      <div class="flex items-center space-x-3 overflow-hidden">
        <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 shrink-0">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse mr-1.5"></span> ONLINE
        </span>
        <span class="truncate text-amber-100/90 font-medium text-xs">
          <i class="fa-solid fa-bullhorn text-amber-400 mr-1.5"></i> Bienvenido al panel oficial de <strong>Nirvana Infinito GSM</strong>. Servicios 24/7 de Server & Cable.
        </span>
      </div>
      <div class="flex items-center space-x-4 text-xs font-semibold shrink-0">
        <a href="https://wa.me/" target="_blank" class="hover:text-emerald-400 transition flex items-center gap-1.5">
          <i class="fa-brands fa-whatsapp text-emerald-400 text-sm"></i> WhatsApp Soporte
        </a>
        <a href="https://t.me/" target="_blank" class="hover:text-sky-400 transition flex items-center gap-1.5">
          <i class="fa-brands fa-telegram text-sky-400 text-sm"></i> Telegram
        </a>
      </div>
    </div>
  </div>

  <!-- HEADER TIPO PANEL -->
  <header class="border-b border-gray-800 bg-gray-900/95 backdrop-blur sticky top-0 z-40 shadow-xl shadow-black/40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex justify-between items-center">
      
      <!-- LOGO BRAND -->
      <div class="flex items-center space-x-3">
        <div class="w-11 h-11 bg-gradient-to-tr from-amber-600 via-yellow-500 to-amber-300 rounded-xl flex items-center justify-center text-gray-950 font-black shadow-lg shadow-amber-500/20 text-2xl border border-amber-400/40">
          ♾️
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="text-xl font-black tracking-wider text-white">NIRVANA <span class="text-amber-400">INFINITO</span></span>
            <span class="bg-amber-500/20 text-amber-300 text-[9px] font-extrabold px-1.5 py-0.5 rounded border border-amber-500/30 uppercase tracking-widest">GSM PANEL</span>
          </div>
          <span class="block text-[10px] text-gray-400 font-mono uppercase tracking-widest -mt-0.5">Servicios DHRU & Unlock Server</span>
        </div>
      </div>

      <!-- BOTÓN / MENÚ USUARIO -->
      <div id="auth-header-btn">
        <button onclick="openAuthModal()" class="bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-400 hover:to-yellow-400 text-gray-950 font-black px-5 py-2.5 rounded-xl transition-all shadow-lg shadow-amber-500/20 hover:shadow-amber-500/40 text-xs flex items-center gap-2 uppercase tracking-wider cursor-pointer border border-amber-300/30">
          <i class="fa-solid fa-user-shield text-sm"></i>
          <span>Ingresar / Registrarse</span>
        </button>
      </div>

      <div id="user-header-info" class="hidden flex items-center space-x-3">
        <div class="bg-gray-800/90 border border-amber-500/30 rounded-xl px-3.5 py-1.5 text-right shadow-inner">
          <div id="user-email-display" class="text-[10px] uppercase text-gray-400 font-semibold truncate max-w-[130px]">Usuario</div>
          <div id="display-saldo" class="text-sm font-black text-amber-400 font-mono">$0.00 USD</div>
        </div>
        <button onclick="logout()" class="bg-gray-800 hover:bg-red-600/20 hover:text-red-400 text-gray-300 p-2.5 rounded-xl border border-gray-700 transition" title="Cerrar Sesión">
          <i class="fa-solid fa-power-off text-sm"></i>
        </button>
      </div>

    </div>
  </header>

  <!-- BANNER DORADO DE CABECERA -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-5 w-full">
    <div class="w-full rounded-2xl overflow-hidden border border-amber-500/30 shadow-2xl shadow-amber-500/10 bg-gray-900 group">
      <img src="banner.png" alt="Nirvana Infinito GSM Banner" class="w-full h-auto object-cover block group-hover:scale-[1.01] transition-transform duration-500">
    </div>
  </div>

  <!-- MAIN CONTENEDOR TIPO TEAM-SAUL -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full flex-grow space-y-5">

    <!-- CONTROLES, NAVEGACIÓN Y BUSCADOR -->
    <div class="bg-gray-900/90 border border-gray-800 rounded-2xl p-4 shadow-xl space-y-4">
      
      <!-- BUSCADOR PRINCIPAL -->
      <div class="flex flex-col md:flex-row gap-3 items-center justify-between">
        <div class="relative w-full md:w-2/3">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-amber-400/70 text-xs"></i>
          <input type="text" id="search-service" onkeyup="filterServices()" placeholder="Buscar servicio por nombre, marca o herramienta (ej: Samsung, Xiaomi, FRP, License)..." class="w-full bg-gray-950 border border-gray-800 rounded-xl pl-10 pr-4 py-2.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-amber-500/80 transition shadow-inner font-medium">
        </div>
        
        <!-- ESTADÍSTICAS RÁPIDAS -->
        <div class="flex items-center gap-2 text-xs font-semibold w-full md:w-auto justify-end">
          <span class="bg-gray-950 border border-gray-800 text-gray-400 px-3 py-2 rounded-xl flex items-center gap-2">
            <i class="fa-solid fa-server text-amber-400"></i>
            <span>Servicios: <strong id="total-services-count" class="text-white font-mono">6</strong></span>
          </span>
          <span class="bg-gray-950 border border-gray-800 text-emerald-400 px-3 py-2 rounded-xl flex items-center gap-2">
            <i class="fa-solid fa-bolt"></i> Auto API
          </span>
        </div>
      </div>

      <!-- TABS DE CATEGORÍAS -->
      <div class="flex items-center gap-2 overflow-x-auto pb-1 custom-scrollbar text-xs border-t border-gray-800/80 pt-3">
        <button onclick="filterCategory('all', this)" class="cat-tab bg-amber-500 text-gray-950 font-black px-4 py-2 rounded-xl transition shrink-0 uppercase tracking-wider shadow-md">
          <i class="fa-solid fa-border-all mr-1"></i> Todos
        </button>
        <button onclick="filterCategory('frp', this)" class="cat-tab bg-gray-950 hover:bg-gray-800 text-gray-300 font-bold px-4 py-2 rounded-xl border border-gray-800 transition shrink-0 uppercase tracking-wider">
          <i class="fa-brands fa-android text-emerald-400 mr-1"></i> FRP / Google
        </button>
        <button onclick="filterCategory('xiaomi', this)" class="cat-tab bg-gray-95
