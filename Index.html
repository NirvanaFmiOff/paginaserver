<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nirvana Infinito GSM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #ffffff;
            line-height: 1.6;
        }
        header {
            background: #161b22;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #30363d;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo {
            font-size: 1.2rem;
            font-weight: bold;
            color: #58a6ff;
            letter-spacing: 1px;
        }
        /* Menú Hamburguesa */
        .menu-toggle {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1.8rem;
            cursor: pointer;
        }
        .nav-links {
            display: none;
            position: absolute;
            top: 60px;
            left: 0;
            width: 100%;
            background: #161b22;
            flex-direction: column;
            border-bottom: 1px solid #30363d;
            padding: 10px 0;
        }
        .nav-links.active {
            display: flex;
        }
        .nav-links a {
            color: #c9d1d9;
            text-decoration: none;
            padding: 12px 20px;
            text-align: center;
            transition: background 0.2s;
        }
        .nav-links a:hover {
            background: #21262d;
            color: #58a6ff;
        }
        /* Contenedor principal */
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
            text-align: center;
        }
        .banner-container img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid #30363d;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #58a6ff;
        }
        p.subtitle {
            color: #8b949e;
            margin-bottom: 30px;
        }
        /* Formulario / Tarjeta */
        .card {
            background: #161b22;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #30363d;
            margin-bottom: 20px;
            text-align: left;
        }
        .card h3 {
            margin-bottom: 15px;
            color: #c9d1d9;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
        }
        button.btn-primary {
            width: 100%;
            padding: 12px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.btn-primary:hover {
            background: #2ea043;
        }
        /* Botones flotantes */
        .floating-buttons {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }
        .float-btn {
            background: #25d366;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 1.5rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .float-btn:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">♾️ NIRVANA INFINITO</div>
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
        <nav class="nav-links" id="navLinks">
            <a href="#">Inicio</a>
            <a href="#">Servicios GSM</a>
            <a href="#">Consultas IMEI</a>
            <a href="#">Contacto</a>
        </nav>
    </header>

    <div class="container">
        <!-- Banner principal -->
        <div class="banner-container">
            <img src="banner.png" alt="Nirvana Infinito Banner">
        </div>

        <h1>Servicios Profesionales GSM</h1>
        <p class="subtitle">Soluciones oficiales y soporte especializado</p>

        <!-- Sección Interactiva / Consulta -->
        <div class="card">
            <h3>Verificación y Consultas</h3>
            <p style="color: #8b949e; font-size: 0.9rem; margin-bottom: 15px;">Ingresá los datos correspondientes para procesar tu solicitud:</p>
            <input type="text" placeholder="Ingrese IMEI o Código de Consulta...">
            <button class="btn-primary" onclick="alert('Consulta enviada correctamente')">Consultar Estado</button>
        </div>
    </div>

    <!-- Botón flotante de WhatsApp -->
    <div class="floating-buttons">
        <a href="https://wa.me/" target="_blank" class="float-btn" title="Escribinos por WhatsApp">💬</a>
    </div>

    <script>
        function toggleMenu() {
            const nav = document.getElementById('navLinks');
            nav.classList.toggle('active');
        }
    </script>
</body>
  </html>
