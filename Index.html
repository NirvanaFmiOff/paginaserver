<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nirvana Infinito GSM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #ffffff;
            line-height: 1.6;
        }
        header {
            background: #161b22;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #30363d;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffb703;
            letter-spacing: 1px;
        }
        .header-btn {
            background: linear-gradient(135deg, #ffb703, #fb8500);
            color: #0d1117;
            padding: 8px 15px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 4px 10px rgba(255, 183, 3, 0.3);
        }
        /* Menú Hamburguesa */
        .menu-toggle {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1.8rem;
            cursor: pointer;
        }
        .nav-links {
            display: none;
            position: absolute;
            top: 60px;
            left: 0;
            width: 100%;
            background: #161b22;
            flex-direction: column;
            border-bottom: 1px solid #30363d;
            padding: 10px 0;
        }
        .nav-links.active {
            display: flex;
        }
        .nav-links a {
            color: #c9d1d9;
            text-decoration: none;
            padding: 12px 20px;
            text-align: center;
            transition: background 0.2s;
        }
        .nav-links a:hover {
            background: #21262d;
            color: #ffb703;
        }
        /* Contenedor principal */
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
            text-align: center;
        }
        .banner-container img {
            width: 100%;
            max-height: 280px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid #30363d;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        /* Formulario / Tarjeta */
        .card {
            background: #161b22;
            padding: 25px 20px;
            border-radius: 16px;
            border: 1px solid #30363d;
            margin-bottom: 20px;
            text-align: left;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .badge {
            background: rgba(255, 183, 3, 0.1);
            color: #ffb703;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 183, 3, 0.2);
        }
        .card h2 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: #ffffff;
        }
        .card p {
            color: #8b949e;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: bold;
            color: #ffb703;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
        }
        input[type="text"]:focus {
            border-color: #ffb703;
            outline: none;
        }
        button.btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ffb703, #fb8500);
            color: #0d1117;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            box-shadow: 0 4px 15px rgba(255, 183, 3, 0.3);
        }
        button.btn-primary:hover {
            opacity: 0.9;
        }
        /* Botones flotantes */
        .floating-buttons {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }
        .float-btn {
            background: #25d366;
            color: white;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 1.8rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: transform 0.2s;
        }
        .float-btn:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">♾️ NIRVANA INFINITO</div>
        <a href="https://t.me/" target="_blank" class="header-btn">Canal Oficial 🚀</a>
    </header>

    <div class="container">
        <!-- Banner principal -->
        <div class="banner-container">
            <img src="banner.png" alt="Nirvana Infinito Banner">
        </div>

        <!-- Sección Interactiva / Consulta IMEI -->
        <div class="card">
            <span class="badge">Sistema Exclusivo</span>
            <h2>Check de Dispositivos</h2>
            <p>Ingresá el código IMEI de 15 dígitos para iniciar la verificación oficial.</p>
            
            <label for="imei">CÓDIGO IMEI</label>
            <input type="text" id="imei" placeholder="Ej: 355762292145410">
            
            <button class="btn-primary" onclick="alert('Consulta procesada con éxito')">PROCESAR CONSULTA</button>
        </div>
    </div>

    <!-- Botón flotante de WhatsApp -->
    <div class="floating-buttons">
        <a href="https://wa.me/" target="_blank" class="float-btn" title="Escribinos por WhatsApp">💬</a>
    </div>

</body>
</html>
